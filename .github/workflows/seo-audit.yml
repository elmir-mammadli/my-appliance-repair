name: Daily SEO Article Auditor

# Secrets required:
#   ANTHROPIC_API_KEY — Claude API key (already set)
#   TAVILY_API_KEY    — Tavily search API key (already set)

on:
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC = 6 AM ET daily
  workflow_dispatch:       # Allow manual trigger for testing

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic tavily-python

      - name: Run SEO audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python .github/scripts/seo_audit.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet content/posts.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push improved posts
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts.json
          git commit -m "seo: daily article audit and optimization [$(date +'%Y-%m-%d')]"
          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No posts were modified — nothing to commit."
