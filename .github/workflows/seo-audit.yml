name: Daily SEO Article Auditor

# Secrets required:
#   ANTHROPIC_API_KEY — Claude API key (already set)
#   TAVILY_API_KEY    — Tavily search API key (already set)

on:
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC = 6 AM ET daily
  workflow_dispatch:       # Allow manual trigger for testing

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic tavily-python

      - name: Run SEO audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python .github/scripts/seo_audit.py

      - name: Prepare proposed SEO edits
        run: |
          git diff -- content/posts.json > "$RUNNER_TEMP/blog-seo-edits.patch"
          if test ! -s "$RUNNER_TEMP/blog-seo-edits.patch"; then
            rm "$RUNNER_TEMP/blog-seo-edits.patch"
          fi

      - name: Upload proposed edits for review
        uses: actions/upload-artifact@v4
        with:
          name: blog-seo-edits
          path: ${{ runner.temp }}/blog-seo-edits.patch
          if-no-files-found: ignore
