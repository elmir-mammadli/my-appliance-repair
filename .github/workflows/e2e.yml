name: E2E Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Dummy values — /api/book is mocked at the network layer so these are never called
      GOOGLE_SERVICE_ACCOUNT_EMAIL: test@test.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQC7dummy\n-----END PRIVATE KEY-----\n"
      GOOGLE_SHEET_ID: dummy_sheet_id
      GOOGLE_SHEET_TAB: Service Requests
      RESEND_API_KEY: re_dummy_key
      NOTIFICATION_EMAIL: test@test.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
