name: Generate Blog Drafts

on:
  schedule:
    - cron: '0 9 */3 * *'  # 9 AM UTC = ~5 AM ET every 3 days
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic tavily-python

      - name: Generate blog posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python .github/scripts/generate_posts.py

      - name: Prepare draft patch
        run: |
          git diff -- content/posts.json > "$RUNNER_TEMP/blog-drafts.patch"
          if test ! -s "$RUNNER_TEMP/blog-drafts.patch"; then
            rm "$RUNNER_TEMP/blog-drafts.patch"
          fi

      - name: Upload drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: blog-drafts
          path: ${{ runner.temp }}/blog-drafts.patch
          if-no-files-found: ignore
