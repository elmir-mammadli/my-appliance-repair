name: Generate Daily Blog Posts

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC = ~5 AM ET daily
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate blog posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/generate_posts.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet content/posts.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push new posts
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "MY APPLIANCE Blog Bot"
          git config user.email "bot@myappliance.us"
          git add content/posts.json
          git commit -m "feat: auto-generate 2 blog posts [$(date +'%Y-%m-%d')]"
          git push
