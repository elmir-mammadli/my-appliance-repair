name: Generate Blog Drafts

# The every-three-days schedule was removed on 2026-11-26. Batch-generated posts were the
# ones Google declined to index (7 of 37 indexed). New posts are written from real jobs.
# Manual runs remain possible for drafting help.
on:
  workflow_dispatch:

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic tavily-python

      - name: Generate blog posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python .github/scripts/generate_posts.py

      - name: Prepare draft patch
        run: |
          git diff -- content/posts.json > "$RUNNER_TEMP/blog-drafts.patch"
          if test ! -s "$RUNNER_TEMP/blog-drafts.patch"; then
            rm "$RUNNER_TEMP/blog-drafts.patch"
          fi

      - name: Upload drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: blog-drafts
          path: ${{ runner.temp }}/blog-drafts.patch
          if-no-files-found: ignore
